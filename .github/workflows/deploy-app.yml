name: Deploy App

# Builds the app on a GitHub runner and deploys it to Databricks Apps, so nobody
# has to run `databricks bundle deploy` (or any build) on a laptop. The build
# happens in CI; consumers just click "Run workflow" (or push to main).
#
# ── ONE-TIME SETUP (still done via the notebooks; can't be fully automated
#    because Lakebase Change Data Feed activation is a UI step) ──────────────
#   1. notebooks/01_setup_lakebase.py        — Lakebase project + seed
#   2. notebooks/02_setup_forward_etl.py     — activate CDF (UI) + metric view
#   3. notebooks/03_deploy_app.py Steps 1–3  — create the Genie Space, create the
#      App, and bind its resources (postgres, genie_space, secret).
#   Step 4 of notebook 03 (the app *code* deploy) is exactly what THIS workflow
#   replaces — so after the one-time setup, code updates deploy from CI.
#
# ── REQUIRED repo secrets (Settings → Secrets and variables → Actions) ──────
#   DATABRICKS_HOST    https://<your-workspace>.cloud.databricks.com
#   DATABRICKS_TOKEN   token / service-principal credential. Its identity must
#                      have CAN_MANAGE on the App and write access to its own
#                      workspace home (where the bundle syncs the build).
# ── OPTIONAL repo variables (or dispatch inputs below) ──────────────────────
#   APP_NAME           default: kpi-reporting
#   LAKEBASE_PROJECT   default: kpi-reporting

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Databricks App name"
        default: "kpi-reporting"
      lakebase_project:
        description: "Lakebase project id"
        default: "kpi-reporting"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app.yml"
      - "pyproject.toml"
      - "package.json"
      - "databricks.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      APP_NAME: ${{ github.event.inputs.app_name || vars.APP_NAME || 'kpi-reporting' }}
      LAKEBASE_PROJECT: ${{ github.event.inputs.lakebase_project || vars.LAKEBASE_PROJECT || 'kpi-reporting' }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Databricks secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_HOST and DATABRICKS_TOKEN secrets are required to deploy."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - uses: databricks/setup-cli@main

      - name: Build frontend + wheel and sync to the workspace
        # `bundle deploy` runs `uv run apx build` (frontend + wheel) and syncs the
        # result, including .build/, to ~/financial-kpi-reporting/dev/files in the
        # token identity's workspace home. (CI uses the bundle; consumers don't.)
        run: databricks bundle deploy -t dev

      - name: Resolve synced .build path
        id: paths
        run: |
          FILES=$(databricks bundle summary -t dev -o json \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['workspace']['file_path'])")
          echo "build=$FILES/.build" >> "$GITHUB_OUTPUT"
          echo "App source path: $FILES/.build"

      - name: Generate app.yml with runtime env, upload into .build
        # `bundle deploy` syncs a bare app.yml (command only). Overwrite it with the
        # runtime env: LAKEBASE_PROJECT (literal) and GENIE_SPACE_ID (from the bound
        # `genie_space` app resource created in notebook 03 Step 3). To enable
        # Confluence publishing, add the KPI_REPORTING_CONFLUENCE_* env entries here
        # (token via `valueFrom: confluence_api_token`).
        run: |
          cat > app.runtime.yml <<EOF
          command: ["uvicorn", "kpi_reporting.backend.app:app", "--workers", "2"]
          env:
            - name: KPI_REPORTING_LAKEBASE_PROJECT
              value: "${LAKEBASE_PROJECT}"
            - name: GENIE_SPACE_ID
              valueFrom: genie_space
          EOF
          databricks workspace import "${{ steps.paths.outputs.build }}/app.yml" \
            --file app.runtime.yml --format AUTO --overwrite

      - name: Deploy the app
        run: databricks apps deploy "$APP_NAME" --source-code-path "${{ steps.paths.outputs.build }}"
