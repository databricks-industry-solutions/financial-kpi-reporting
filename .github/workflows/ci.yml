name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    name: Validate Databricks Bundle
    # Validation resolves the workspace user for the bundle root path, so it needs
    # workspace credentials. Secrets are not available to Dependabot or fork PRs;
    # skip the check there instead of failing it.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Bundles need the current Databricks CLI; the `databricks-cli` pip package is
      # the legacy CLI and has no `bundle` command.
      - name: Install Databricks CLI
        if: env.DATABRICKS_TOKEN != ''
        uses: databricks/setup-cli@main

      - name: Validate bundle
        if: env.DATABRICKS_TOKEN != ''
        run: databricks bundle validate

      - name: Skip (no workspace credentials)
        if: env.DATABRICKS_TOKEN == ''
        run: echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN are not available to this run; skipped bundle validation."

  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Sync Python deps
        run: uv sync --locked

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Build first: it generates src/kpi_reporting/_metadata.py, which the backend
      # imports and pyright needs to resolve.
      - name: Build frontend & backend
        run: uv run apx build

      - name: Lint Python (ruff)
        run: uv run --with ruff ruff check src/

      - name: Type-check Python (pyright)
        run: uv run --with pyright pyright src/

      # Needs the route tree the build generates (src/kpi_reporting/ui/types/routeTree.gen.ts).
      - name: Type-check frontend (tsc)
        run: bun x tsc --noEmit -p tsconfig.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            .build/
            dist/
          if-no-files-found: ignore
          retention-days: 7

  vuln-scan:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # Audit exactly the locked runtime dependencies (not dev tooling, and not the
      # auditing tool's own environment).
      - name: Python — pip-audit
        run: |
          uv export --locked --no-dev --format requirements-txt --no-emit-project > requirements-audit.txt
          uvx pip-audit --strict --progress-spinner=off --no-deps --disable-pip -r requirements-audit.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: JS — bun audit
        run: bun pm audit --prod

  codeql:
    runs-on: ubuntu-latest
    name: CodeQL (${{ matrix.language }})
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  release:
    runs-on: ubuntu-latest
    name: Tagged Release Build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-bundle, build-and-test, vuln-scan, codeql]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Sync Python deps
        run: uv sync

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build release artifacts
        run: |
          uv run apx build
          uv build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            .build/**

  summary:
    runs-on: ubuntu-latest
    needs: [validate-bundle, build-and-test, vuln-scan, codeql]
    if: always()
    name: CI Summary
    steps:
      - name: Check build status
        run: |
          fail=0
          for r in \
            "${{ needs.validate-bundle.result }}" \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.vuln-scan.result }}" \
            "${{ needs.codeql.result }}"; do
            if [ "$r" = "failure" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
