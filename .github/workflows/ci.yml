name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    name: Validate Databricks Bundle
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Validate bundle
        run: databricks bundle validate

  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Sync Python deps
        run: uv sync

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Lint Python (ruff)
        run: |
          uv run pip install ruff
          uv run ruff check src/

      - name: Type-check Python (pyright)
        run: |
          uv run pip install pyright
          uv run pyright src/

      - name: Build frontend & backend
        run: uv run apx build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            .build/
            dist/
          if-no-files-found: ignore
          retention-days: 7

  vuln-scan:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync Python deps
        run: uv sync

      - name: Python — pip-audit
        run: |
          uv run pip install pip-audit
          uv run pip-audit --strict --progress-spinner=off

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: JS — bun audit
        run: bun pm audit --prod

  codeql:
    runs-on: ubuntu-latest
    name: CodeQL (${{ matrix.language }})
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  release:
    runs-on: ubuntu-latest
    name: Tagged Release Build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-bundle, build-and-test, vuln-scan, codeql]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Sync Python deps
        run: uv sync

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build release artifacts
        run: |
          uv run apx build
          uv build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            .build/**

  summary:
    runs-on: ubuntu-latest
    needs: [validate-bundle, build-and-test, vuln-scan, codeql]
    if: always()
    name: CI Summary
    steps:
      - name: Check build status
        run: |
          fail=0
          for r in \
            "${{ needs.validate-bundle.result }}" \
            "${{ needs.build-and-test.result }}" \
            "${{ needs.vuln-scan.result }}" \
            "${{ needs.codeql.result }}"; do
            if [ "$r" = "failure" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
