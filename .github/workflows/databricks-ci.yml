name: Databricks Asset Bundle CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Smoke-tests the Asset Bundle on every PR/push: validate, then deploy the
# `dev` target and tear it down. `bundle deploy` pushes the notebooks + built
# wheel to the workspace (it does not run the notebooks or create Lakebase/Genie
# resources — those are interactive setup steps), so this is a safe regression
# check on the bundle config + build.
#
# Requires two repo secrets:
#   DATABRICKS_HOST   e.g. https://<your-workspace>.cloud.databricks.com
#   DATABRICKS_TOKEN  a token (or service-principal credential) for that workspace
# When they're absent (e.g. on fork PRs), the bundle steps are skipped so the
# check still passes.

jobs:
  bundle-smoke-test:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Databricks secrets
        id: check
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN not configured — skipping the bundle smoke test."
          fi

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.check.outputs.configured == 'true'
        run: pip install uv

      - name: Set up Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        if: steps.check.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Set up Databricks CLI
        if: steps.check.outputs.configured == 'true'
        uses: databricks/setup-cli@main

      - name: Validate bundle
        if: steps.check.outputs.configured == 'true'
        run: databricks bundle validate -t dev

      - name: Deploy bundle (smoke test)
        if: steps.check.outputs.configured == 'true'
        run: databricks bundle deploy -t dev

      - name: Destroy bundle (cleanup)
        if: always() && steps.check.outputs.configured == 'true'
        run: databricks bundle destroy -t dev --auto-approve
