[project]
name = "financial-kpi-reporting"
dynamic = ["version"]
description = "Financial KPI Reporting reference app — APX + Lakebase + Genie + Confluence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "psycopg[binary]>=3.0",
    "sqlalchemy>=2.0",
    "httpx>=0.28.0",
    # OpenAI-compatible client for the agent features (backend/agent.py), pointed
    # at Databricks foundation-model serving endpoints.
    "openai>=1.60.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12", "apx==0.2.6",
]

[tool.apx.metadata]
app-name = "Financial KPI Reporting"
app-slug = "kpi_reporting"
app-entrypoint = "kpi_reporting.backend.app:app"
api-prefix = "/api"
metadata-path = "src/kpi_reporting/_metadata.py"

[tool.apx.ui]
root = "src/kpi_reporting/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"


[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.uv]

# Resolve from public PyPI by default, so dependency resolution is identical for
# everyone regardless of any private mirror in a contributor's *global* uv config.
# Behind a mirror? Override locally (do NOT commit):
#   export UV_DEFAULT_INDEX=https://<your-mirror>/simple
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "apx-index"
url = "https://databricks-solutions.github.io/apx/simple"

[tool.uv.sources]

[tool.uv.sources.apx]
index = "apx-index"

[tool.hatch.build.hooks.version]
path = "src/kpi_reporting/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/kpi_reporting/__dist__", "src/kpi_reporting/_metadata.py"]
exclude = ["src/kpi_reporting/ui"]

# Explicit src layout — project name (financial-kpi-reporting) doesn't
# match the module (kpi_reporting), so hatch's auto-detect doesn't kick in.
# This places src/kpi_reporting at the wheel root as kpi_reporting/.
[tool.hatch.build.targets.wheel]
packages = ["src/kpi_reporting"]
